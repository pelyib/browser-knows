<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Browser knows</title>
        <link rel="stylesheet" href="assets/css/bootstrap.min.5.3.3.css">
        <link rel="stylesheet" href="assets/css/easymde.min.2.18.0.css">
        <link rel="stylesheet" href="assets/css/style.css">
    </head>
    <body>
        <header class="app-header">
            <div class="app-header-inner">
                <h1 class="app-title">A journey of a thousand miles begins with a single step</h1>
                <div class="search-group">
                    <div class="search">
                        <div class="search-input-wrap">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input id="search" type="text" tabindex="1" autofocus placeholder="Search your knowledge&hellip;" />
                            <button id="clearSearch" type="button" class="clear-search-btn" aria-label="Clear search" title="Clear search">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <button id="createNewKnowledgeModalOpenButton" type="button" class="btn btn-primary" data-bs-toggle="modal"
                            data-bs-target="#newKnowledgeFormModal">
                            New entry
                        </button>
                        <button id="themeToggle" type="button" class="btn btn-outline-secondary header-icon-btn" aria-label="Switch to dark mode" title="Switch to dark mode">
                            &#127769;
                        </button>
                    </div>
                    <ul id="selectedTagsFilter" class="list-inline selected-tags-filter"></ul>
                </div>
            </div>
        </header>
        <main class="container-fluid">
            <div id="container"
                class="row justify-content-center row-cols-1 row-cols-md-2 row-cols-lg-2 row-cols-xl-3 row-cols-xxl-4">
            </div>
        </main>
        <footer class="app-footer">finito.</footer>

        <div id="knowledgeViewModal" class="modal" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Knowledge</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="knowledgeViewBody"></div>
                        <ul id="knowledgeViewTags" class="list-inline mt-3"></ul>
                    </div>
                </div>
            </div>
        </div>

        <div id="toastContainer" class="toast-container top-0 end-0">
            <div id="newKnowledgeFormTagTooShort" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body">tag must be 3 character long</div>
            </div>
            <div id="newKnowledgeFormTagAlreadyAdded" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body">Already on the list</div>
            </div>
            <div id="newKnowledgeFormBodyEmpty" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body">You haven't wrote anything yet</div>
            </div>
            <div id="newKnowledgeFormCreated" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body">New core memory saved</div>
            </div>
            <div id="newKnowledgeFormUpdated" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-body">Knowledge updated</div>
            </div>
        </div>

        <div id="newKnowledgeFormModal" class="modal" tabindex="-1" role="dialog">
            <form id="newKnowledgeForm">
                <input id="newKnowledgeFormTags" name="tags" type="text" readonly hidden />
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 id="newKnowledgeFormModalTitle" class="modal-title">An entire new knowledge</h5>
                            <button id="createNewKnowledgeModalCloseButton" type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Close" data-bs-toggle="modal" data-bs-target="#newKnowledgeFormModal">
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="container-fluid">
                                <div class="row">
                                    <textarea id="newKnowledgeFormBody"></textarea>
                                </div>
                                <div class="row">
                                    <div class="col-auto input-group-sm">
                                        <ul id="newKnowledgeFormVisibleTags" class="list-inline">
                                        </ul>
                                    </div>
                                    <div class="col-5">
                                        <div class="input-group input-group-sm">
                                            <span class="input-group-text" id="addon-wrapping">#</span>
                                            <input id="newKnowledgeFormTag" type="text" class="form-control form-control-sm" placeholder="tag" aria-label="tag" aria-describedby="addon-wrapping" list="newKnowledgeFormTagOptions">
                                            <datalist id="newKnowledgeFormTagOptions"></datalist>
                                            <button class="btn btn-outline-secondary" type="button"
                                                id="addTag">Add</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button id="newKnowledgeFormSubmitButton" type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </body>
    <script src="assets/js/newtab.js"></script>
</html>
